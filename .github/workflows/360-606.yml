name: 360 OpenWrt 固件自动编译

on:
  # 仅保留手动触发
  workflow_dispatch:
    inputs:
      ssh:
        description: '启用SSH远程调试（true/false）'
        required: false
        default: 'false'
  # 注释掉下面的自动触发规则
  # repository_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - '.config'
  #     - 'feeds.conf.default'
  #     - 'diy-part*.sh'
  #     - '.github/workflows/*.yml'
  # schedule:
  #   - cron: '0 0 * * 0'

env:
  # 基础配置（按需修改）
  OPENWRT_COMPILE_DIR: ${{ github.workspace }}/openwrt
  TZ: Asia/Shanghai
  FEEDS_CONF: feeds.conf.default       # 自定义订阅源文件（放在仓库根目录）
  CONFIG_FILE: .config                 # 编译配置文件（放在仓库根目录）
  DIY_P1_SH: diy-part1.sh              # 前置自定义脚本（放在仓库根目录，可选）
  DIY_P2_SH: diy-part2.sh              # 后置自定义脚本（放在仓库根目录，可选）
  # 上传配置
  UPLOAD_BIN_DIR: false                # 是否上传完整bin目录（体积大，按需开启）
  UPLOAD_FIRMWARE: true                # 是否上传固件到Artifacts
  UPLOAD_RELEASE: true                 # 是否上传到GitHub Release（需打tag触发）
  # 源码配置（修改为你自己的OpenWrt源码地址）
  OPENWRT_REPO: https://github.com/ASUK3/immortalwrt-mt798x-6.6
  OPENWRT_BRANCH: openwrt-24.10-6.6

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ==============================================
      # ① 检出仓库代码
      # ==============================================
      - name: ① 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==============================================
      # ② 初始化编译环境（清理空间 + 安装依赖）
      # ==============================================
      - name: ② 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils subversion libnss3-dev libelf-dev ccache dos2unix
          # 清理无用文件释放磁盘空间
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker rmi $(docker images -q) 2>/dev/null || true
          echo "✅ 编译环境初始化完成"

          # ==============================================
      # ③ 克隆OpenWrt源码（浅克隆加速）
      # ==============================================
      - name: ③ 克隆OpenWrt源码
        run: |
          git clone --depth 1 --branch $OPENWRT_BRANCH $OPENWRT_REPO $OPENWRT_COMPILE_DIR
          cd $OPENWRT_COMPILE_DIR
          echo "✅ 源码克隆完成，分支：$(git rev-parse --abbrev-ref HEAD)，提交：$(git rev-parse --short HEAD)"

      # ==============================================
      # ③.⑤ 挂载tmpfs内存加速
      # ==============================================
      - name: ③.⑤ 挂载tmpfs内存加速
        run: |
          # 先创建挂载点目录（解决目录不存在的问题）
          mkdir -p $OPENWRT_COMPILE_DIR/build_dir
          mkdir -p $OPENWRT_COMPILE_DIR/staging_dir
          # GitHub免费Runner为4核16G内存，此处分配10G给build_dir、4G给staging_dir
          sudo mount -t tmpfs -o size=10G tmpfs $OPENWRT_COMPILE_DIR/build_dir
          sudo mount -t tmpfs -o size=4G tmpfs $OPENWRT_COMPILE_DIR/staging_dir
          echo "✅ tmpfs挂载完成"
          df -h | grep -E 'build_dir|staging_dir'

      # ==============================================
      # ④ Git协议配置（避免SSH子模块错误）
      # ==============================================
      - name: ④ Git协议配置
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://".insteadOf git://
          echo "✅ Git协议配置完成"

      # ==============================================
      # ④.⑤ 修复脚本换行符（Unix格式）
      # ==============================================
      - name: ④.⑤ 修复脚本文件格式
        run: |
          cd $OPENWRT_COMPILE_DIR
          find . -type f \( -name '*.sh' -o -name '*.config' -o -name 'Makefile' \) \
            -exec dos2unix {} + 2>/dev/null || true
          echo "✅ 源码脚本换行符修复完成"

      # ==============================================
      # ⑤ 加载自定义订阅源 + 执行前置自定义脚本
      # ==============================================
      - name: ⑤ 加载自定义订阅源 + 前置脚本
        run: |
          cd $OPENWRT_COMPILE_DIR
          # 替换自定义feeds.conf
          if [ -f $GITHUB_WORKSPACE/$FEEDS_CONF ]; then
            cp $GITHUB_WORKSPACE/$FEEDS_CONF feeds.conf.default
            echo "✅ 已替换自定义feeds.conf.default"
          fi
          # 执行前置自定义脚本
          if [ -f $GITHUB_WORKSPACE/$DIY_P1_SH ]; then
            chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
            bash $GITHUB_WORKSPACE/$DIY_P1_SH
            echo "✅ 前置自定义脚本执行完成"
          fi

      # ==============================================
      # ⑥ 禁用modemfeed订阅源（避免SSH子模块错误）
      # ==============================================
      - name: ⑥ 禁用modemfeed订阅源
        run: |
          cd $OPENWRT_COMPILE_DIR
          sed -i '/modemfeed/d' feeds.conf.default 2>/dev/null || true
          echo "✅ 已禁用modemfeed订阅源"

      # ==============================================
      # ⑦ 更新软件订阅源
      # ==============================================
      - name: ⑦ 更新软件订阅源
        run: |
          cd $OPENWRT_COMPILE_DIR
          ./scripts/feeds update -a
          echo "✅ 软件订阅源更新完成"

      # ==============================================
      # ⑧ 安装订阅源软件包
      # ==============================================
      - name: ⑧ 安装订阅源软件包
        run: |
          cd $OPENWRT_COMPILE_DIR
          ./scripts/feeds install -a
          echo "✅ 订阅源软件包安装完成"

      # ==============================================
      # ⑨ 缓存下载包目录（加速重复编译）
      # ==============================================
      - name: ⑨ 缓存下载包目录
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENWRT_COMPILE_DIR }}/dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      # ==============================================
      # ⑩ 缓存ccache编译缓存（核心加速）
      # ==============================================
      - name: ⑩ 缓存ccache编译缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-openwrt-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ccache-

      # ==============================================
      # ⑪ 加载编译配置 + 执行后置自定义脚本
      # ==============================================
      - name: ⑪ 加载编译配置 + 后置脚本
        run: |
          cd $OPENWRT_COMPILE_DIR
          # 加载自定义.config
          if [ -f $GITHUB_WORKSPACE/$CONFIG_FILE ]; then
            cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
            echo "✅ 已加载自定义.config"
          else
            echo "⚠️  未找到自定义.config，将生成默认配置"
            make defconfig
          fi
          # 执行后置自定义脚本
          if [ -f $GITHUB_WORKSPACE/$DIY_P2_SH ]; then
            chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
            bash $GITHUB_WORKSPACE/$DIY_P2_SH
            echo "✅ 后置自定义脚本执行完成"
          fi
          # 强制启用ccache
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          echo "✅ 编译配置加载完成"

      # ==============================================
      # ⑫ SSH远程连接调试（可选，手动触发时启用）
      # ==============================================
      - name: ⑫ SSH远程调试（可选）
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ssh == 'true' }}
        with:
          limit-access-to-actor: true
          timeout-minutes: 30

      # ==============================================
      # ⑬ 预下载所有依赖包（并行加速）
      # ==============================================
      - name: ⑬ 预下载所有依赖包
        run: |
          cd $OPENWRT_COMPILE_DIR
          make download -j$(nproc) V=s
          echo "✅ 依赖包预下载完成"

      # ==============================================
      # ⑬.⑤ 提前修复rootfs安装脚本换行符（核心修复）
      # ==============================================
      - name: ⑬.⑤ 提前修复安装脚本换行符
        run: |
          cd $OPENWRT_COMPILE_DIR
          ROOT_TMP_DIR=$(ls -d staging_dir/target-*/root-*/tmp 2>/dev/null | head -n1)
          if [ -n "$ROOT_TMP_DIR" ] && [ -d "$ROOT_TMP_DIR" ]; then
            echo "🔧 修复rootfs安装脚本换行符为Unix格式"
            find "$ROOT_TMP_DIR" -type f \
              \( -name '*.postinst' -o -name '*.prerm' -o -name '*.postrm' -o -name '*.preinst' \) \
              -exec sed -i 's/\r$//' {} +
            echo "✅ 修复完成"
          else
            echo "ℹ️  未到编译阶段，跳过修复"
          fi

      # ==============================================
      # ⑭ 编译固件（增强版：自动修复+失败重试+详细排查）
      # ==============================================
      - name: ⑭ 编译固件（自动修复+重试）
        run: |
          cd $OPENWRT_COMPILE_DIR
          export CCACHE_DIR=~/.ccache
          ccache -M 10G  # ccache最大缓存10G

          # 函数：修复安装脚本换行符
          fix_script_newlines() {
            local root_tmp
            root_tmp=$(ls -d staging_dir/target-*/root-*/tmp 2>/dev/null | head -n1)
            if [ -n "$root_tmp" ] && [ -d "$root_tmp" ]; then
              echo "🔧 自动修复安装脚本换行符"
              find "$root_tmp" -type f \
                \( -name '*.postinst' -o -name '*.prerm' -o -name '*.postrm' -o -name '*.preinst' \) \
                -exec sed -i 's/\r$//' {} +
            fi
          }

          # 函数：输出详细调试信息
          dump_debug_info() {
            echo "=============================="
            echo "📋 1. opkg安装日志末尾"
            find staging_dir -name 'opkg*.log' -type f 2>/dev/null | while read -r log; do
              echo "--- $log ---"
              tail -n 220 "$log"
            done

            echo -e "\n=============================="
            echo "🔍 2. 搜索错误关键字"
            grep -R 'Collected errors\|error\|Error\|ERROR' -n staging_dir/target-*/root-*/tmp 2>/dev/null || true

            echo -e "\n=============================="
            echo "📜 3. 安装脚本详情"
            local root_tmp
            root_tmp=$(ls -d staging_dir/target-*/root-*/tmp 2>/dev/null | head -n1)
            if [ -n "$root_tmp" ] && [ -d "$root_tmp" ]; then
              find "$root_tmp" -type f \
                \( -name '*.postinst' -o -name '*.prerm' -o -name '*.postrm' -o -name '*.preinst' \) | while read -r script; do
                echo -e "\n===== $script ====="
                ls -al "$script"
                echo "--- 内容 ---"
                cat "$script"
                echo "--- 语法检查 ---"
                sh -n "$script" && echo "✅ 语法正常" || echo "❌ 语法错误"
                echo "--- 格式检查 ---"
                file "$script"
              done
            else
              echo "⚠️  未找到rootfs tmp目录"
            fi

            echo -e "\n=============================="
            echo "💾 4. 系统资源检查"
            echo "磁盘空间：" && df -h
            echo -e "\n内存使用：" && free -h
            echo -e "\nccache统计：" && ccache -s
          }

          # 第一次编译：并行加速
          echo "🚀 第一次编译尝试（并行 -j$(nproc)）"
          if make -j$(nproc); then
            echo "✅ 编译成功"
            ccache -s
            exit 0
          fi

          # 失败后自动修复+降级重试
          echo "❌ 第一次编译失败，自动修复后单线程重试..."
          fix_script_newlines

          echo "🔄 第二次编译尝试（单线程 -j1 + 详细日志）"
          if make -j1 V=s; then
            echo "✅ 第二次编译成功"
            ccache -s
            exit 0
          fi

          # 两次均失败，输出完整调试信息
          echo "❌ 编译失败，输出详细调试信息..."
          dump_debug_info
          exit 1

      # ==============================================
      # ⑮ 检查磁盘空间使用情况
      # ==============================================
      - name: ⑮ 检查磁盘空间
        run: |
          cd $OPENWRT_COMPILE_DIR
          echo "=============================="
          echo "💾 磁盘空间使用情况："
          df -h
          echo -e "\n📦 编译目录大小："
          du -sh build_dir staging_dir bin 2>/dev/null || true

      # ==============================================
      # ⑯ 上传bin编译目录（可选）
      # ==============================================
      - name: ⑯ 上传bin编译目录（可选）
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}
          path: ${{ env.OPENWRT_COMPILE_DIR }}/bin
          retention-days: 7

      # ==============================================
      # ⑰ 整理固件文件（自动定位输出目录）
      # ==============================================
      - name: ⑰ 整理固件文件
        run: |
          cd $OPENWRT_COMPILE_DIR
          mkdir -p $GITHUB_WORKSPACE/firmware
          # 复制所有固件格式文件
          find bin/targets -type f \
            \( -name '*.bin' -o -name '*.img' -o -name '*.trx' -o -name '*.itb' \
               -o -name '*.gz' -o -name '*.xz' -o -name '*.sha256sums' \) \
            -exec cp {} $GITHUB_WORKSPACE/firmware/ \;
          # 提取设备名称
          DEVICE_NAME=$(ls bin/targets/*/*/ 2>/dev/null | grep -E '^\S+\.\S+$' | head -n1 | cut -d. -f1 || echo "openwrt")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "✅ 固件整理完成，共 $(ls $GITHUB_WORKSPACE/firmware | wc -l) 个文件"

      # ==============================================
      # ⑱ 上传固件到Artifacts
      # ==============================================
      - name: ⑱ 上传固件到Artifacts
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}
          path: ${{ github.workspace }}/firmware
          retention-days: 30

      # ==============================================
      # ⑲ 上传固件到GitHub Release（需打tag触发）
      # ==============================================
      - name: ⑲ 上传到GitHub Release
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ github.workspace }}/firmware/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================================
      # 完成通知
      # ==============================================
      - name: 编译完成
        run: |
          echo "🎉 OpenWrt编译流程执行完成"
          echo "设备名称：${{ env.DEVICE_NAME }}"
          echo "固件数量：$(ls ${{ github.workspace }}/firmware | wc -l) 个"
