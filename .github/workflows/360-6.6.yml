name: 360 6.6 OpenWrt 固件自动编译

on:
  # 仓库触发事件（可通过 API 远程触发）
  repository_dispatch:
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 远程连接调试'
        required: false
        default: 'false'

# 全局环境变量配置
env:
  # 源码仓库地址（ASUK3 的 6.6 内核版本）
  REPO_URL: https://github.com/ASUK3/immortalwrt-mt798x-6.6
  # 源码分支（openwrt-24.10 + 内核 6.6）
  REPO_BRANCH: openwrt-24.10-6.6
  # 订阅源配置文件
  FEEDS_CONF: feeds.conf.default
  # 编译配置文件
  CONFIG_FILE: .config
  # 自定义脚本 1（更新 feeds 前执行）
  DIY_P1_SH: diy-part1.sh
  # 自定义脚本 2（更新 feeds 后执行）
  DIY_P2_SH: diy-part2.sh
  # 是否上传 bin 目录（包含所有 ipk 包）
  UPLOAD_BIN_DIR: 'false'
  # 是否上传固件到 Artifacts
  UPLOAD_FIRMWARE: 'true'
  # 是否上传到奶牛快传
  UPLOAD_COWTRANSFER: 'false'
  # 是否上传到 WeTransfer
  UPLOAD_WETRANSFER: 'false'
  # 是否上传到 GitHub Release 发布页
  UPLOAD_RELEASE: 'true'
  # 时区设置
  TZ: Asia/Shanghai

jobs:
  build:
    # 使用 Ubuntu 22.04 运行环境
    runs-on: ubuntu-22.04
    
    steps:
    # ============================================================
    # 步骤 1：检出当前仓库代码
    # ============================================================
    - name: ① 检出仓库代码
      uses: actions/checkout@main

    # ============================================================
    # 步骤 2：初始化编译环境（强清理 + 安装依赖）
    # 注意：这里不提前创建 openwrt 目录，避免 git clone 失败
    # ============================================================
    - name: ② 初始化编译环境（清理空间 + 安装依赖）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -eux
        
        echo "==== 清理前磁盘空间 ===="
        df -hT || true
        
        # 强清理：释放 GitHub runner 磁盘空间（删除不必要的预装软件）
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache \
          /usr/local/share/boost \
          /usr/share/swift \
          /var/lib/apt/lists/* || true
        
        # 更新软件源
        sudo -E apt-get -qq update
        
        # 安装 ImmortalWrt 官方推荐的编译依赖（Ubuntu 22.04 适配）
        sudo -E apt-get -qq install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl \
          device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool \
          lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
          lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev zstd
        
        # 清理无用包
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        
        # 设置时区
        sudo timedatectl set-timezone "$TZ"
        
        # 只创建 /workdir 父目录，不创建 openwrt 子目录
        sudo mkdir -p /workdir
        sudo chown "$USER":"$GROUPS" /workdir
        
        echo "==== 清理后磁盘空间 ===="
        df -hT || true
        
        echo "==== CPU 核心数 ===="
        nproc

    # ============================================================
    # 步骤 3：克隆 OpenWrt 源码（浅克隆 + 单分支加速）
    # ============================================================
    - name: ③ 克隆 OpenWrt 源码（浅克隆加速）
      working-directory: /workdir
      run: |
        set -eux
        
        # 浅克隆 + 单分支 + 过滤 blob：极致减少下载量和时间
        git clone --depth 1 --single-branch --filter=blob:none \
          "$REPO_URL" -b "$REPO_BRANCH" openwrt
        
        # 创建软链接方便后续操作
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    # ============================================================
    # 步骤 3.5：挂载 tmpfs 内存文件系统
    # 必须在克隆源码之后、恢复缓存之前执行
    # ============================================================
    - name: ③.⑤ 挂载 tmpfs 内存加速
      run: |
        set -eux
        
        # 在克隆后的 openwrt 目录中创建 dl 和 .ccache 目录
        mkdir -p /workdir/openwrt/dl
        mkdir -p /workdir/openwrt/.ccache
        
        # 挂载 tmpfs 到 dl 目录（4G 内存）
        sudo mount -t tmpfs -o size=4G tmpfs /workdir/openwrt/dl
        
        # 挂载 tmpfs 到 .ccache 目录（4G 内存）
        sudo mount -t tmpfs -o size=4G tmpfs /workdir/openwrt/.ccache
        
        # 设置权限
        sudo chown "$USER":"$GROUPS" /workdir/openwrt/dl
        sudo chown "$USER":"$GROUPS" /workdir/openwrt/.ccache
        
        echo "==== tmpfs 挂载情况 ===="
        df -hT | grep -E "tmpfs|Filesystem" || true

    # ============================================================
    # 步骤 4：Git 全局配置（强制使用 HTTPS 协议）
    # ============================================================
    - name: ④ Git 协议配置（避免 SSH 私钥问题）
      run: |
        set -eux
        
        # 将所有 git@github.com 协议替换为 https://github.com/
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global url."https://github.com/".insteadOf "git://github.com/"

    # ============================================================
    # 步骤 4.5：修复脚本文件格式（关键！解决 CRLF 换行符问题）
    # 自动将 Windows 格式的脚本转为 Unix 格式
    # ============================================================
    - name: ④.⑤ 修复脚本文件格式（自动转 Unix 换行符）
      run: |
        set -eux
        
        # 移除 Windows 回车符 \r
        sed -i 's/\r$//' "$DIY_P1_SH" "$DIY_P2_SH" 2>/dev/null || true
        
        # 确保脚本有执行权限
        chmod +x "$DIY_P1_SH" "$DIY_P2_SH"
        
        echo "脚本格式已修复"
        echo "==== 文件格式确认 ===="
        file "$DIY_P1_SH" "$DIY_P2_SH" || true

    # ============================================================
    # 步骤 5：加载自定义 feeds 配置 + 执行 diy-part1 脚本
    # ============================================================
    - name: ⑤ 加载自定义订阅源 + 执行前置自定义脚本
      run: |
        set -eux
        
        # 如果仓库根目录有自定义 feeds.conf.default，则替换默认的
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        
        # 进入 OpenWrt 目录执行自定义脚本
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # ============================================================
    # 步骤 6：禁用 modemfeed（避免 SSH 子模块拉取报错）
    # ============================================================
    - name: ⑥ 禁用 modemfeed 订阅源（避免 SSH 子模块错误）
      run: |
        set -eux
        
        if [ -f openwrt/feeds.conf.default ]; then
          # 删除包含 modemfeed 的行
          sed -i '/modemfeed/d' openwrt/feeds.conf.default
          echo "==== feeds.conf.default（已移除 modemfeed）===="
          cat openwrt/feeds.conf.default
        fi

    # ============================================================
    # 步骤 7：更新订阅源 feeds
    # ============================================================
    - name: ⑦ 更新软件订阅源
      run: |
        set -eux
        cd openwrt
        ./scripts/feeds update -a

    # ============================================================
    # 步骤 8：安装订阅源中的软件包
    # ============================================================
    - name: ⑧ 安装订阅源软件包
      run: |
        set -eux
        cd openwrt
        ./scripts/feeds install -a

    # ============================================================
    # 步骤 9：缓存 dl 下载目录（避免重复下载源码包）
    # 缓存会恢复到 tmpfs（内存）中，速度极快
    # ============================================================
    - name: ⑨ 缓存下载包目录（加速重复编译）
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-openwrt-dl-

    # ============================================================
    # 步骤 10：缓存 ccache 编译缓存（核心加速手段）
    # 缓存会恢复到 tmpfs（内存）中，速度极快
    # ============================================================
    - name: ⑩ 缓存 ccache 编译缓存（核心加速）
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-openwrt-ccache-

    # ============================================================
    # 步骤 11：加载自定义编译配置 + 执行 diy-part2 脚本
    # ============================================================
    - name: ⑪ 加载编译配置 + 执行后置自定义脚本
      run: |
        set -eux
        
        # 如果仓库根目录有 files/ 自定义文件目录，移动到 openwrt/files
        [ -d files ] && mv files openwrt/files || true
        
        # 如果有自定义 .config 文件，替换默认的
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        
        # 进入 OpenWrt 目录执行自定义脚本
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    # ============================================================
    # 步骤 12：SSH 远程连接调试（可选）
    # ============================================================
    - name: ⑫ SSH 远程连接调试（可选）
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    # ============================================================
    # 步骤 13：下载编译依赖包（并行加速）
    # ============================================================
    - name: ⑬ 预下载所有依赖包（并行加速）
      id: package
      run: |
        set -eux
        cd openwrt
        
        # 配置 ccache 编译缓存
        export CCACHE_DIR="$PWD/.ccache"
        export CC="ccache gcc"
        export CXX="ccache g++"
        
        # 设置 ccache 最大缓存为 4G
        ccache -M 4G || true
        
        # 显示 ccache 当前状态
        ccache -s || true
        
        # 生成默认编译配置
        make defconfig
        
        # 并行下载所有依赖包（使用全部 CPU 核心）
        make download -j"$(nproc)"
        
        # 清理下载失败的小文件（小于 1024 字节通常是下载错误）
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    # ============================================================
    # 步骤 14：编译固件（智能并行 + 失败自动降级 + 日志输出）
    # ============================================================
    - name: ⑭ 编译固件（智能并行加速 + 失败自动降级重试）
      id: compile
      run: |
        set -eux
        cd openwrt
        
        # 配置 ccache 编译缓存
        export CCACHE_DIR="$PWD/.ccache"
        export CC="ccache gcc"
        export CXX="ccache g++"
        
        # 设置 ccache 最大缓存为 4G
        ccache -M 4G || true
        
        # ========== 智能并行度控制 ==========
        # CPU 核心数 + 1 作为并行任务数（比单纯 nproc 更高效）
        JOBS=$(( $(nproc) + 1 ))
        echo "使用 $JOBS 线程并行编译"
        export MAKEFLAGS="-j$JOBS"
        
        # ========== 编译失败时的调试日志函数 ==========
        dump_debug_logs() {
          echo "=============================="
          echo "==== 调试信息：磁盘空间 ===="
          df -hT || true
          df -ih || true
          echo "=============================="
          echo "==== 调试信息：opkg 日志末尾 ===="
          ls -al staging_dir/target-*/root-*/tmp 2>/dev/null || true
          tail -n 220 staging_dir/target-*/root-*/tmp/opkg*.log 2>/dev/null || true
          echo "=============================="
          echo "==== 调试信息：搜索错误汇总 ===="
          grep -R "Collected errors" -n staging_dir/target-*/root-*/tmp 2>/dev/null || true
          echo "=============================="
          echo "==== 调试信息：安装脚本列表 ===="
          ls -al staging_dir/target-*/root-*/tmp/*.postinst 2>/dev/null | tail -n 50 || true
        }
        
        # ========== 智能降级编译策略 ==========
        if make world; then
          echo "编译成功（最大并行度）"
        elif make -j2 world; then
          echo "编译成功（2 线程降级模式）"
        elif make -j1 world; then
          echo "编译成功（单线程模式）"
        elif make -j1 V=s world; then
          echo "编译成功（单线程详细输出模式）"
        else
          echo "错误：编译失败，正在输出调试日志..."
          dump_debug_logs
          exit 1
        fi
        
        # 显示 ccache 编译缓存统计
        ccache -s || true
        
        # 输出编译成功状态
        echo "status=success" >> "$GITHUB_OUTPUT"
        
        # 提取设备名称
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi
        
        # 生成时间戳
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    # ============================================================
    # 步骤 15：检查磁盘空间使用情况
    # ============================================================
    - name: ⑮ 检查磁盘空间使用情况
      if: (!cancelled())
      run: df -hT

    # ============================================================
    # 步骤 16：上传 bin 目录（包含所有 ipk 安装包）
    # ============================================================
    - name: ⑯ 上传 bin 编译目录（可选）
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # ============================================================
    # 步骤 17：整理固件文件（自动定位输出目录）
    # ============================================================
    - name: ⑰ 整理固件文件（自动定位输出目录）
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -eux
        
        TARGETS_DIR="openwrt/bin/targets"
        
        echo "==== 调试：openwrt/bin 目录内容 ===="
        ls -la openwrt/bin || true
        
        # 检查 targets 目录是否存在
        if [ ! -d "$TARGETS_DIR" ]; then
          echo "错误：$TARGETS_DIR 目录不存在"
          find openwrt -maxdepth 4 -type d -print | head -n 200 || true
          exit 1
        fi
        
        echo "==== 调试：targets 目录结构 ===="
        ls -la "$TARGETS_DIR" || true
        find "$TARGETS_DIR" -maxdepth 3 -type d -print || true
        
        echo "==== 调试：targets 目录文件列表（前 200）===="
        find "$TARGETS_DIR" -maxdepth 3 -type f -print | head -n 200 || true
        
        # 自动定位固件输出目录：targets/<平台>/<子平台>
        FIRMWARE_DIR="$(find "$TARGETS_DIR" -mindepth 2 -maxdepth 2 -type d | head -n 1 || true)"
        
        # 如果二级目录不存在，回退到一级目录
        if [ -z "${FIRMWARE_DIR}" ]; then
          echo "警告：未找到二级目标目录，回退到一级目录"
          FIRMWARE_DIR="$(find "$TARGETS_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
        fi
        
        # 如果还是找不到，报错退出
        if [ -z "${FIRMWARE_DIR}" ]; then
          echo "错误：$TARGETS_DIR 下未找到任何目标输出目录"
          exit 1
        fi
        
        # 进入固件目录，删除 packages 子目录（减少上传体积）
        cd "${FIRMWARE_DIR}"
        rm -rf packages || true
        
        # 输出固件目录路径到环境变量
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    # ============================================================
    # 步骤 18：上传固件到 Artifacts
    # ============================================================
    - name: ⑱ 上传固件到 Artifacts
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ============================================================
    # 步骤 19：上传固件到 GitHub Release 发布页
    # ============================================================
    - name: ⑲ 上传固件到 GitHub Release 发布页
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.FILE_DATE }}
        body: "OpenWrt 自动编译固件 - 360 路由器专用（内核 6.6）"
        files: ${{ env.FIRMWARE }}/*
