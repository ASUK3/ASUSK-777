name: 360 OpenWrt 固件编译

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接 Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config.360
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检查代码
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -eux
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        set -eux
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # （可留可不留）尝试把 ssh submodule 强制走 https
    - name: Git 全局改用 HTTPS（避免 git@github.com 需要私钥）
      run: |
        set -eux
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global url."https://github.com/".insteadOf "git://github.com/"

    - name: 加载自定义提要
      run: |
        set -eux
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # ✅ 关键修复：直接禁用 modemfeed（否则它的 SSH 子模块会让 feeds update 失败）
    - name: 禁用 modemfeed（避免 SSH 子模块报错）
      run: |
        set -eux
        if [ -f openwrt/feeds.conf.default ]; then
          sed -i '/modemfeed/d' openwrt/feeds.conf.default
          echo "==== feeds.conf.default（已移除 modemfeed）===="
          cat openwrt/feeds.conf.default
        fi

    - name: 更新订阅源
      run: |
        set -eux
        cd openwrt
        ./scripts/feeds update -a

    - name: 安装订阅源
      run: |
        set -eux
        cd openwrt
        ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        set -eux
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH 连接 Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载依赖包（并行加速）
      id: package
      run: |
        set -eux
        cd openwrt
        make defconfig
        make download -j"$(nproc)"
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: 编译固件（并行加速）
      id: compile
      run: |
        set -eux
        cd openwrt
        echo -e "$(nproc) 线程编译"
        export MAKEFLAGS="-j$(nproc)"

        # 任意一次成功就继续，否则直接失败退出（避免后续找不到 bin/targets）
        if make world; then
          echo "build ok (world, parallel)"
        elif make -j2 world; then
          echo "build ok (world, j2)"
        elif make -j1 world; then
          echo "build ok (world, single)"
        elif make -j1 V=s world; then
          echo "build ok (world, single verbose)"
        else
          echo "ERROR: build failed."
          exit 1
        fi

        echo "::set-output name=status::success"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传编译目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -eux
        FIRMWARE_DIR="$(find openwrt -type d -path 'openwrt/bin/targets/*/*' | head -n 1 || true)"
        if [ -z "${FIRMWARE_DIR}" ]; then
          echo "ERROR: openwrt/bin/targets/*/* not found."
          ls -la openwrt || true
          ls -la openwrt/bin || true
          find openwrt -maxdepth 4 -type d -print | head -n 200 || true
          exit 1
        fi
        cd "${FIRMWARE_DIR}"
        rm -rf packages || true
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "::set-output name=status::success"

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 上传固件到发布页面
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.FILE_DATE }}
        body: "Automated build"
        files: ${{ env.FIRMWARE }}/*
