name: 360 OpenWrt 固件编译

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接 Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config.360
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: 'false'
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_COWTRANSFER: 'false'
  UPLOAD_WETRANSFER: 'false'
  UPLOAD_RELEASE: 'true'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查代码
      uses: actions/checkout@main

    - name: 初始化环境（强清理 + 依赖）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -eux
        echo "==== Disk before cleanup ===="
        df -hT || true

        # 强清理：最大化释放 GitHub runner 空间
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache \
          /usr/local/share/boost \
          /usr/share/swift \
          /var/lib/apt/lists/* || true

        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)

        # ccache（用于编译缓存）
        sudo -E apt-get -qq install ccache

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER":"$GROUPS" /workdir

        echo "==== Disk after cleanup ===="
        df -hT || true

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        set -eux
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Git 全局改用 HTTPS（避免 git@github.com 需要私钥）
      run: |
        set -eux
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global url."https://github.com/".insteadOf "git://github.com/"

    - name: 加载自定义提要 + 执行 diy-part1
      run: |
        set -eux
        # feeds.conf.default 替换（如果仓库根目录有自带的 feeds.conf.default）
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default

        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: 禁用 modemfeed（避免 SSH 子模块报错）
      run: |
        set -eux
        if [ -f openwrt/feeds.conf.default ]; then
          sed -i '/modemfeed/d' openwrt/feeds.conf.default
          echo "==== feeds.conf.default（已移除 modemfeed）===="
          cat openwrt/feeds.conf.default
        fi

    - name: 更新订阅源
      run: |
        set -eux
        cd openwrt
        ./scripts/feeds update -a

    - name: 安装订阅源
      run: |
        set -eux
        cd openwrt
        ./scripts/feeds install -a

    # ====== Cache：dl + ccache（强烈推荐）======
    - name: 缓存 dl（下载包缓存）
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-openwrt-dl-

    - name: 缓存 ccache（编译缓存）
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-openwrt-ccache-

    - name: 加载自定义配置 + 执行 diy-part2
      run: |
        set -eux
        # 如果你的仓库根目录有 files/，移动到 openwrt/files
        [ -d files ] && mv files openwrt/files || true

        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config

        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH 连接 Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载依赖包（并行加速）
      id: package
      run: |
        set -eux
        cd openwrt

        # 开启 ccache
        export CCACHE_DIR="$PWD/.ccache"
        export CC="ccache gcc"
        export CXX="ccache g++"
        ccache -M 2G || true
        ccache -s || true

        make defconfig
        make download -j"$(nproc)"
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: 编译固件（并行加速 + 失败自动吐日志）
      id: compile
      run: |
        set -eux
        cd openwrt

        # 开启 ccache
        export CCACHE_DIR="$PWD/.ccache"
        export CC="ccache gcc"
        export CXX="ccache g++"
        ccache -M 2G || true

        echo -e "$(nproc) 线程编译"
        export MAKEFLAGS="-j$(nproc)"

        dump_opkg_logs() {
          echo "=============================="
          echo "==== DEBUG: disk / inode ===="
          df -hT || true
          df -ih || true
          echo "=============================="
          echo "==== DEBUG: opkg logs (tail) ===="
          ls -ալ staging_dir/target-*/root-*/tmp 2>/dev/null || true
          tail -n 220 staging_dir/target-*/root-*/tmp/opkg*.log 2>/dev/null || true
          echo "=============================="
          echo "==== DEBUG: search 'Collected errors' ===="
          grep -R "Collected errors" -n staging_dir/target-*/root-*/tmp 2>/dev/null || true
          echo "=============================="
          echo "==== DEBUG: last install scripts (postinst) ===="
          ls -al staging_dir/target-*/root-*/tmp/*.postinst 2>/dev/null | tail -n 50 || true
          echo "=============================="
        }

        if make world; then
          echo "build ok (world, parallel)"
        elif make -j2 world; then
          echo "build ok (world, j2)"
        elif make -j1 world; then
          echo "build ok (world, single)"
        elif make -j1 V=s world; then
          echo "build ok (world, single verbose)"
        else
          echo "ERROR: build failed. Dumping debug logs..."
          dump_opkg_logs
          exit 1
        fi

        ccache -s || true

        echo "status=success" >> "$GITHUB_OUTPUT"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传编译目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件（修复 targets 目录匹配）
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -eux

        TARGETS_DIR="openwrt/bin/targets"
        echo "==== DEBUG: openwrt/bin 内容 ===="
        ls -la openwrt/bin || true

        if [ ! -d "$TARGETS_DIR" ]; then
          echo "ERROR: $TARGETS_DIR not found."
          find openwrt -maxdepth 4 -type d -print | head -n 200 || true
          exit 1
        fi

        echo "==== DEBUG: targets 目录结构 ===="
        ls -la "$TARGETS_DIR" || true
        find "$TARGETS_DIR" -maxdepth 3 -type d -print || true
        echo "==== DEBUG: targets 文件（前 200） ===="
        find "$TARGETS_DIR" -maxdepth 3 -type f -print | head -n 200 || true

        # targets/<platform>/<subtarget>
        FIRMWARE_DIR="$(find "$TARGETS_DIR" -mindepth 2 -maxdepth 2 -type d | head -n 1 || true)"
        if [ -z "${FIRMWARE_DIR}" ]; then
          echo "WARN: no 2-level target dir, fallback to 1-level"
          FIRMWARE_DIR="$(find "$TARGETS_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
        fi

        if [ -z "${FIRMWARE_DIR}" ]; then
          echo "ERROR: no target output dir found under $TARGETS_DIR"
          exit 1
        fi

        cd "${FIRMWARE_DIR}"
        rm -rf packages || true

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 上传固件到发布页面
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.FILE_DATE }}
        body: "Automated build"
        files: ${{ env.FIRMWARE }}/*
