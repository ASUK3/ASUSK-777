name: 编译 OpenWrt 固件

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '启用 SSH 远程连接'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1

    steps:
    - name: 🛠️ 代码仓库检查
      uses: actions/checkout@v3

    - name: 🔧 环境初始化
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential clang flex bison g++ gawk \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
          zlib1g-dev file wget
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 📥 源码仓库克隆
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 📦 软件源配置
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: ⚙️ 编译配置生成
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 📡 远程调试连接
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      uses: P3TERX/ssh2actions@v1.0.0
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: ⏬ 依赖包下载
      run: |
        cd openwrt
        make defconfig
        make -j8 download
        find dl -size -1024c -exec rm -f {} \;

    - name: 🚀 固件编译作业
      run: |
        cd openwrt
        export NPROC=$(nproc)
        echo "🎯 使用 ${NPROC} 线程进行编译"
        
        if make -j${NPROC} V=s ; then
          echo "✅ 编译成功"
        else
          echo "⚠️ 首次编译失败，尝试单线程编译..."
          if make -j1 V=s ; then
            echo "✅ 单线程编译成功"
          else
            echo "❌ 编译最终失败"
            exit 1
          fi
        fi
        
        echo "DEVICE_NAME=_$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 📤 编译成果上传
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: 编译成果_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: |
          openwrt/bin/targets/*/*/*
          !openwrt/bin/targets/*/*/packages

    - name: 🗑️ 历史记录清理
      if: always()
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: 🗃️ 旧版本清理
      if: success()
      uses: dev-drprasad/delete-older-releases@v0.1.0
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
